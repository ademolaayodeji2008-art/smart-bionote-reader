<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563EB" />
    <title>You're offline — Smart Bionote Reader</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 45%, #111827 100%);
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #f8fafc;
        text-align: center;
        padding: 24px;
      }

      .card {
        max-width: 420px;
      }

      .logo {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px;
      }

      h1 {
        font-size: 1.5rem;
        margin: 0 0 12px;
      }

      p {
        margin: 0 0 24px;
        color: rgba(248, 250, 252, 0.8);
        line-height: 1.6;
      }

      button {
        background: #f59e0b;
        color: #111827;
        border: none;
        border-radius: 12px;
        padding: 12px 28px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        filter: brightness(1.05);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 64 64">
          <path
            d="M32 20c-4.5-3-10-3.5-14-2v22c4-1.5 9.5-1 14 2 4.5-3 10-3.5 14-2V18c-4-1.5-9.5-1-14 2Z"
            fill="#F8FAFC"
          />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>
        It looks like you've lost your internet connection. Smart Bionote Reader needs a
        connection to load new content — please check your network and try again.
      </p>
      <button type="button" onclick="window.location.reload()">Retry</button>
    </div>
  </body>
</html>
